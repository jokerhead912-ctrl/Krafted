<body data-page-node-id="YtY3PKmZYO75o7vor7RzLP">

<h1 data-page-node-id="948mvPRoiEk1V8VACfWDMj">Krafted wheel probe — v7.10.0</h1>
<p class="hint" data-page-node-id="Q3LA2YQkKjmYQqF8axQquL">
  喺下面個框入面<b data-page-node-id="KEruBiKm1MCOPPwJnMmpBn">向上滾一格</b>，停一停，再<b data-page-node-id="xeaFMfLwRsnrhqdJ9xY8pK">向下滾一格</b>。重複兩三次，正常力度就得。
  呢支 probe 會記低每一個 wheel event，並用 Krafted 而家嘅 router（<code data-page-node-id="6AgxcpI0ao3dsfEg2omQuY">kraftpub-dev.html:24157</code>
  嗰段）原封不動計一次，話你知每一格實際係 <b data-page-node-id="GhYxiGo3jWbdjWJAVCPwRS">pan</b> 定 <b data-page-node-id="17iK6FnENzmGGxnU2McILP">zoom</b>、縮放咗幾多倍。
  量完撳 <b data-page-node-id="sxfkXCsN3pSJX8edr6E3Ya">Copy report</b> 貼返畀我。
</p>

<div class="controls" data-page-node-id="wkfoVarMsPMbMlYhJnS3Li">

    <select id="plat" data-page-node-id="b7bsnNdnk322edoDAYmXOd">
      <option value="1" data-page-node-id="UqGUPdHmC2KvCT1BS1BAlN">macOS (模擬 Mac)</option>
      <option value="0" data-page-node-id="sHfuPLHZrnBRvL9gDO9Sho">Windows (模擬 Win)</option>
    </select>
  </label>
  <label data-page-node-id="iDP2tlMTrBgKheBNAdZv8h">wheelMode
    <select id="wmode" data-page-node-id="ytuAf9iFzEl8EnVutSaXFb">
      <option value="auto" data-page-node-id="CuAKQCq1UEqGHna05fHzQM">auto (Krafted 預設)</option>
      <option value="mouse" data-page-node-id="ybTioEG6WC85eTrg4TuI6A">mouse (右鍵 pin 咗)</option>
      <option value="trackpad" data-page-node-id="n8GIKGAYwfZtA90JWu3Xak">trackpad</option>

    <span id="zstepv" data-page-node-id="FS9N6hhd7pzPUpt5Np8YCd">10%</span></label>
</div>

<div class="row-actions" data-page-node-id="ExjSDI7pibs26CY1BL60Kw">

  <button id="clear" data-page-node-id="EljRfNzi1FmVcKhvnCiSGS">Clear</button>
</div>

<table data-page-node-id="JFmeaUfEHWBCg0B4BQFwbf">
  <thead data-page-node-id="gIoXtiSKolRu98gPT6DZsm">
    <tr data-page-node-id="e70TVfMUmdIx2DAHS7MJql">
      <th data-page-node-id="mJoclmvelvm5fsilg4Gqvc">#</th><th data-page-node-id="sToDd4JADnHCSud8eGvatw">gesture</th><th data-page-node-id="VGzpqRhtwdLlClIbreAePt">deltaY</th><th data-page-node-id="DwsjAXBYIlGK9i370ySjR9">deltaX</th><th data-page-node-id="qVHsnJsaD9ZILuGCQD0lmW">mode</th>
      <th data-page-node-id="KCUlvthCRQVTJTcaUbpS1Y">gap ms</th><th data-page-node-id="tD7EPLqPhQL65O3pMzaRuM">Krafted 會做</th><th data-page-node-id="HrT5eA74ZhHiPeawXUFjlz">倍率</th>
    </tr>
  </thead>
  <tbody id="rows" data-page-node-id="XSTYjUakg7VXikzDw7VKzv"></tbody>
</table>

<div class="verdict" id="verdict" data-page-node-id="suGrMnJi1kswP6hBxJhjkh">仲未收到 wheel event。</div>

<pre id="report" data-page-node-id="UYdYtyv31H8j7IRF9lr8Iw"></pre>

<script>
(function () {
  'use strict';

  var pad = document.getElementById('pad');
  var rows = document.getElementById('rows');
  var verdictEl = document.getElementById('verdict');
  var reportEl = document.getElementById('report');
  var platSel = document.getElementById('plat');
  var wmodeSel = document.getElementById('wmode');
  var natCb = document.getElementById('nat');
  var zstep = document.getElementById('zstep');
  var zstepv = document.getElementById('zstepv');

  var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform) || /Mac/.test(navigator.userAgent || '');
  platSel.value = isMac ? '1' : '0';
  natCb.checked = isMac;

  var events = [];
  var gestures = [];
  var g = null;
  var seq = 0;
  var GESTURE_GAP = 200;

  zstep.addEventListener('input', function () { zstepv.textContent = zstep.value + '%'; });
  // Changing the simulated device means the stream we were judging no longer
  // applies, so start the heuristic from scratch.
  wmodeSel.addEventListener('change', function () { K.reset(); });
  platSel.addEventListener('change', function () { K.reset(); });

  function zoomStep() { return 1 + (parseInt(zstep.value, 10) || 10) / 100; }

  // ── v7.10.0 ────────────────────────────────────────────────────────────
  // A COPY of _WheelKind (kraftpub-dev.html:23994) and the wheel router
  // (24187). It cannot slice the real source from a standalone file, so it
  // will drift if the source is edited. The authority is
  // Krafted/tests/test_v7_10_0.js, which executes the real thing. If this
  // page and Krafted disagree, Krafted is right and this copy is stale.
  var K = (function () {
    var verdict = 'unknown', confidence = 0, lastT = 0, recent = [];
    var NOTCH_FLOOR = 40, FINGER_CEIL = 8, MOUSE_LOCK = 0.68;

    function classify(e) {
      var now = (e.timeStamp || performance.now());
      var gap = lastT ? (now - lastT) : 9999;
      lastT = now;
      var ady = Math.abs(e.deltaY), adx = Math.abs(e.deltaX);

      if (gap > 600) { recent = []; }
      if (e.deltaMode !== 0) { verdict = 'mouse'; confidence = 1; return verdict; }
      if (adx > 0.55 && ady > 0.55 && (adx >= 1.4 || adx >= ady * 0.24)) {
        verdict = 'trackpad'; confidence = 1; return verdict;
      }
      recent.push(ady);
      if (recent.length > 8) recent.shift();

      var score = 0;
      if (ady >= NOTCH_FLOOR && gap > 30) score += 2;
      else if (ady > 0 && ady <= FINGER_CEIL && (adx > 0.5 || !Number.isInteger(e.deltaY))) score -= 2;
      if (adx > 0.5 && ady > 0.5) score -= 2;
      if (ady > 0 && Number.isInteger(e.deltaY)) score += 1;
      if (ady > 0 && !Number.isInteger(e.deltaY)) score -= 1;
      if (gap < 30) score -= 1; else if (gap > 120) score += 1;
      if (recent.length >= 2) {
        var seen = {}, n = 0, i;
        for (i = 0; i < recent.length; i++) seen[Math.round(recent[i])] = 1;
        for (i in seen) n++;
        if (n === 1 && recent[0] > 0) score += 3;
        else if (n >= recent.length - 1) score -= 1;
      }
      if (score > 0) {
        if (verdict === 'mouse') confidence = Math.min(1, confidence + 0.34);
        else { verdict = 'mouse'; confidence = 0.34; }
      } else if (score < 0) {
        if (verdict === 'trackpad') confidence = Math.min(1, confidence + 0.34);
        else { verdict = 'trackpad'; confidence = 0.34; }
      }
      return verdict;
    }

    return {
      classify: classify,
      isMouse: function (wm) {
        if (wm === 'mouse') return true;
        if (wm === 'trackpad') return false;
        return verdict === 'mouse' && confidence >= MOUSE_LOCK;
      },
      isTrackpad: function (wm) {
        if (wm === 'trackpad') return true;
        if (wm === 'mouse') return false;
        return verdict === 'trackpad';
      },
      locked: function (wm) {
        if (wm === 'mouse') return true;
        if (wm === 'trackpad') return false;
        return verdict === 'mouse' && confidence >= MOUSE_LOCK;
      },
      raw: function () { return verdict; },
      conf: function () { return confidence; },
      info: function () { return verdict + ' (' + Math.round(confidence * 100) + '%)'; },
      reset: function () { verdict = 'unknown'; confidence = 0; lastT = 0; recent = []; }
    };
  })();

  // _twoFingerPan is false: this probe is for a physical mouse.
  function route(e, mac, wheelMode, natural) {
    K.classify(e);
    var s = zoomStep();
    var ady = Math.abs(e.deltaY);
    var adx = Math.abs(e.deltaX);
    var macWheelLikeMouse = (wheelMode === 'mouse');
    var isMouse = K.isMouse(wheelMode);
    // v7.10.0: one definition of direction, and a mouse ignores naturalScroll.
    function dz() { return (isMouse || !natural) ? e.deltaY : -e.deltaY; }

    if (mac && e.metaKey) {
      return { act: 'zoom', why: 'Cmd+wheel', f: dz() < 0 ? s : 1 / s };
    }
    if (e.ctrlKey) {
      var forceMouseMode = (wheelMode === 'mouse');
      var strongDrift = (adx > 0.55 && ady > 0.55 && (adx >= 1.4 || adx >= ady * 0.24));
      var strongPinch = K.isTrackpad(wheelMode) ||
        (e.deltaMode === 0 && (!Number.isInteger(e.deltaY) || ady <= 8 || strongDrift));
      var macPinch = mac && e.deltaMode === 0 && !isMouse && (strongPinch || !forceMouseMode);
      if (macPinch) {
        var pct = (s - 1) * 0.26;
        var ps = Math.max(0.020, Math.min(0.080, ady * pct));
        return { act: 'zoom', why: 'pinch path', f: e.deltaY > 0 ? 1 - ps : 1 + ps };
      }
      if (e.deltaMode !== 0 || isMouse) {
        return { act: 'zoom', why: 'Ctrl+wheel (mouse step)', f: dz() < 0 ? s : 1 / s };
      }
      var pct3 = (s - 1) * 0.26;
      var ps3 = Math.max(0.020, Math.min(0.080, ady * pct3));
      return { act: 'zoom', why: 'pinch fallback', f: e.deltaY > 0 ? 1 - ps3 : 1 + ps3 };
    }
    if (mac ? (e.deltaMode === 0 && !macWheelLikeMouse && !isMouse)
             : (false && e.deltaMode === 0)) {
      return { act: 'pan', why: 'pan branch', f: 1 };
    }
    if (e.shiftKey && (e.deltaMode !== 0 || isMouse)) {
      return { act: 'pan', why: 'Shift horizontal pan', f: 1 };
    }
    return { act: 'zoom', why: 'plain wheel zoom', f: dz() < 0 ? s : 1 / s };
  }

  function newGesture(ev) {
    return {
      n: gestures.length + 1,
      t0: ev.timeStamp || performance.now(),
      events: 0,
      sumDY: 0,
      absDY: 0,
      factor: 1,
      act: '',
      why: ''
    };
  }

  pad.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    pad.classList.add('hot');

    var mac = platSel.value === '1';
    var wm = wmodeSel.value;
    var nat = natCb.checked;

    var r = route(ev, mac, wm, nat);
    r.v = K.raw();
    r.c = K.conf();
    r.lock = K.locked(wm);
    var t = ev.timeStamp || performance.now();

    if (!g || (t - g.t0) > GESTURE_GAP || !g.events) {
      if (g && g.events) gestures.push(g);
      g = newGesture(ev);
      if (!g.t0) g.t0 = t;
    }
    // A direction flip with a real gap also starts a new gesture.
    if (g.events > 0 && (t - g.tLast) > GESTURE_GAP) {
      gestures.push(g);
      g = newGesture(ev);
      g.t0 = t;
      g.sumDY = 0; g.absDY = 0; g.factor = 1;
    }

    var gap = g.events ? Math.round(t - g.tLast) : 0;
    g.tLast = t;
    g.events++;
    g.sumDY += ev.deltaY;
    g.absDY += Math.abs(ev.deltaY);
    g.factor *= r.f;
    g.act = r.act;
    g.why = r.why;

    events.push({
      i: ++seq, gn: g.n, dy: ev.deltaY, dx: ev.deltaX,
      mode: ev.deltaMode, gap: gap, r: r
    });

    render();
  }, { passive: false });

  pad.addEventListener('mouseenter', function () { pad.classList.add('hot'); });
  pad.addEventListener('mouseleave', function () { pad.classList.remove('hot'); });

  function fmt(n, d) { return Number(n).toFixed(d === undefined ? 3 : d); }

  function render() {
    var live = g && g.events ? gestures.concat([g]) : gestures.slice();
    var html = '';
    for (var i = Math.max(0, events.length - 30); i < events.length; i++) {
      var e = events[i];
      var cls = e.r.act === 'pan' ? 'pan' : (e.r.f >= 1 ? 'zoomin' : 'zoomout');
      html += '<tr>'
        + '<td>' + e.i + '</td>'
        + '<td>' + e.gn + '</td>'
        + '<td>' + fmt(e.dy, 2) + '</td>'
        + '<td>' + fmt(e.dx, 2) + '</td>'
        + '<td>' + e.mode + '</td>'
        + '<td>' + e.gap + '</td>'
        + '<td class="' + cls + '">' + e.r.act + ' — ' + e.r.why
        + ' <span style="opacity:.45">' + (e.r.lock ? 'locked' : e.r.v) + '</span></td>'
        + '<td class="' + cls + '">' + fmt(e.r.f, 4) + '</td>'
        + '</tr>';
    }
    rows.innerHTML = html || '<tr><td colspan="8" style="color:#6f6f78">等緊 wheel event…</td></tr>';

    if (!live.length) return;
    var last = live[live.length - 1];
    var zoomGestures = live.filter(function (x) { return x.act === 'zoom'; });
    var avgEvents = live.reduce(function (a, x) { return a + x.events; }, 0) / live.length;
    var avgAbs = live.reduce(function (a, x) { return a + x.absDY; }, 0) / live.length;

    var parts = [];
    parts.push('<b>收到 ' + live.length + ' 格</b>，平均 <b>' + fmt(avgEvents, 1)
      + ' 個 event/格</b>，平均 |deltaY| 合共 <b>' + fmt(avgAbs, 1) + '</b>');
    parts.push('deltaMode 全部係 <b>' + events[events.length - 1].mode + '</b>');
    parts.push('最近一格：' + last.events + ' events / sum deltaY '
      + fmt(last.sumDY, 1) + ' → <b>' + last.act + '</b>（' + last.why + '）'
      + '，累積 <b>' + fmt(last.factor, 3) + '×</b>');
    parts.push('classifier: <b>' + K.info() + '</b> — '
      + (K.locked(wmodeSel.value)
        ? '<b>locked as a mouse</b> → a plain wheel zooms'
        : 'not locked → a plain wheel pans (needs '
          + (Math.max(0, Math.ceil((0.68 - K.conf()) / 0.34))) + ' more agreeing notch'
          + (Math.ceil((0.68 - K.conf()) / 0.34) === 1 ? '' : 'es') + ')'));

    if (zoomGestures.length) {
      var zf = zoomGestures[zoomGestures.length - 1].factor;
      parts.push('Windows 同樣一格會係 <b>' + fmt(zoomStep(), 3) + '×</b> 或 <b>'
        + fmt(1 / zoomStep(), 3) + '×</b> → 而家 Mac 係 <b>' + fmt(zf, 3) + '×</b>');
    }
    verdictEl.innerHTML = parts.join('<br>');

    reportEl.textContent = buildReport(live);
  }

  function buildReport(live) {
    var mac = platSel.value === '1';
    var out = [];
    out.push('Krafted wheel probe v7.10.0');
    out.push('navigator.platform = ' + navigator.platform);
    out.push('navigator.userAgent = ' + navigator.userAgent);
    out.push('simulated platform = ' + (mac ? 'macOS' : 'Windows'));
    out.push('wheelMode = ' + wmodeSel.value + ', naturalScroll = ' + natCb.checked
      + ', zoomStep = ' + zoomStep().toFixed(2));
    out.push('classifier = ' + K.info() + ', locked as mouse = '
      + (K.locked(wmodeSel.value) ? 'YES' : 'no'));
    out.push('');
    out.push('gesture  events  sumDeltaY  absDeltaY  action  why  cumulativeFactor');
    live.forEach(function (x) {
      out.push('  ' + String(x.n).padEnd(6)
        + ' ' + String(x.events).padEnd(7)
        + ' ' + fmt(x.sumDY, 1).padStart(9)
        + ' ' + fmt(x.absDY, 1).padStart(10)
        + '  ' + x.act.padEnd(6)
        + ' ' + x.why.padEnd(28)
        + ' ' + fmt(x.factor, 4));
    });
    out.push('');
    out.push('raw events (last 60):');
    events.slice(-60).forEach(function (e) {
      out.push('  #' + e.i + ' g' + e.gn + ' dy=' + fmt(e.dy, 2)
        + ' dx=' + fmt(e.dx, 2) + ' mode=' + e.mode
        + ' gap=' + e.gap + 'ms -> ' + e.r.act + ' x' + fmt(e.r.f, 4) + ' (' + e.r.why + ')'
        + ' [' + (e.r.lock ? 'mouse-locked' : e.r.v + ' ' + Math.round(e.r.c * 100) + '%') + ']');
    });
    return out.join('\n');
  }

  document.getElementById('clear').addEventListener('click', function () {
    events = []; gestures = []; g = null; seq = 0;
    verdictEl.textContent = '仲未收到 wheel event。';
    reportEl.textContent = '';
    render();
  });

  document.getElementById('copy').addEventListener('click', function () {
    var txt = reportEl.textContent || '(empty)';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        toast('已複製');
      }, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('複製失敗,手動揀啦'); }
      document.body.removeChild(ta);
    }
    function toast(m) {
      var b = document.getElementById('copy');
      var old = b.textContent;
      b.textContent = m;
      setTimeout(function () { b.textContent = old; }, 1200);
    }
  });

  render();
})();
</script>
